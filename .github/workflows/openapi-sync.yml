name: OpenAPI sync

# Keeps the generated route layer in step with core's node API document.
#
# Core's openapi-sync workflow sends `repository_dispatch` (type
# `core-openapi`, `client_payload.commit` = the core commit) whenever
# `docs/public/openapi.json` changes on its master; a weekly run catches a
# missed event. The sync itself is core's reusable sdk-openapi-sync.yml, the
# one all four SDKs call: it vendors that commit's document
# (scripts/refresh-openapi.sh), regenerates src/generated/ (`pnpm gen:api`),
# and, when anything changed, opens or refreshes one pull request on the
# machine-owned branch `chore/core-openapi`, listing the generated methods that
# were added, removed or changed (scripts/openapi-sync-summary.mjs).
#
# The pull request is titled by what the change does to callers, which is what
# semantic-release reads: `feat(api)!:` with a `BREAKING-CHANGE:` footer (major),
# `feat(api):` (minor) or `chore(api):` (patch). core's
# scripts/openapi-classify.py decides, from the document vendored here now
# against the new one.
#
# Two things here are load-bearing:
#
#   * The pull request is pushed and opened with a GitHub App installation
#     token (the organization's shared vars.ACTIONS_APP_ID /
#     secrets.ACTIONS_APP_PRIVATE_KEY, as fleet-bump.yml uses), NOT with
#     GITHUB_TOKEN: a pull request made by GITHUB_TOKEN runs no workflows, so
#     the sync would arrive with no CI and read as green. The app
#     must be installed on this repository with contents and pull-requests write.
#
#   * `chore/core-openapi` belongs to this workflow and is force-pushed on every
#     sync. Do not commit to it by hand: push a fix to a branch of your own.
#
# The `uses:` line pins core's workflow by commit; the classifier it runs is
# read from core at that same commit. Move the pin to take a change there.

on:
  repository_dispatch:
    types: [core-openapi]
  workflow_dispatch:
    inputs:
      ref:
        description: "Core branch, tag or commit to vendor the document from"
        required: false
        default: master
        type: string
      dry_run:
        description: "Regenerate and print the summary, but push nothing"
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, in case an event from core was missed.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Never cancel: a cancelled run can leave the branch pushed with no pull
# request opened against it. Queue instead.
concurrency:
  group: openapi-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    uses: calimero-network/core/.github/workflows/sdk-openapi-sync.yml@fb0ed2e0c891df7e5a6fea9b0ad78b4e94a011b5
    with:
      ref: ${{ inputs.ref }}
      dry-run: ${{ inputs.dry_run == true }}
      timeout-minutes: 20
      pnpm: true
      node-version: "20"
      setup: pnpm install --frozen-lockfile
      # openapi/SOURCE records a commit core sent as on master.
      generate: |
        scripts/refresh-openapi.sh "$CORE_TARGET" "$CORE_RECORDED"
        pnpm gen:api
      vendor-path: openapi/core-openapi.json
      source-file: openapi/SOURCE
      source-key: commit
      owned-paths: openapi/core-openapi.json openapi/SOURCE src/generated
      # openapi/SOURCE alone moving (a new core commit with the same document)
      # is not worth a pull request.
      changed-paths: openapi/core-openapi.json src/generated
      summary: |
        node scripts/openapi-sync-summary.mjs \
          "$SYNC_BEFORE/src/generated/methods.ts" src/generated/methods.ts \
          "$SYNC_BEFORE/src/generated/api.ts" src/generated/api.ts
      # The check the pull request's CI runs anyway, so a sync that breaks the
      # build says so in this run too.
      check: pnpm typecheck
      app-id: ${{ vars.ACTIONS_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
