name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  # core >= 0.11.0-rc.17 removed the first-login bootstrap secret: a node mints
  # its admin root key at `merod init` (or at startup when unbootstrapped) from
  # these env vars, and enforces an 8-char minimum password at creation
  # (core#3081). The `merod init` steps below inherit this env, so the admin
  # account exists before the node listens, and the e2e login (same creds, via
  # MERO_E2E_USER/PASS) signs straight in. CI-only values for ephemeral nodes.
  MERO_AUTH_ADMIN_USER: dev
  MERO_AUTH_ADMIN_PASSWORD: dev-password

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm typecheck
      - run: pnpm typecheck:consumer
      # Binds each contract spec's field names to the declared types; the live
      # half of the same suites runs in the e2e job below.
      - run: pnpm typecheck:contract
      - run: pnpm lint

  e2e:
    name: E2E (vs released merod)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Download released merod
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-released-merod.sh

      - name: Boot merod (embedded auth, single node)
        run: |
          ./merod --home ./e2e-node --node e2e init \
            --server-port 4001 --swarm-port 4002 --auth-mode embedded
          ./merod --home ./e2e-node --node e2e run > merod.log 2>&1 &
          echo $! > merod.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/admin-api/health >/dev/null 2>&1 && { echo "merod healthy"; break; }
            sleep 2
            [ "$i" = "30" ] && { echo "merod did not become healthy"; exit 1; }
          done

      # The e2e harness self-provisions (installs kv-store if absent) and reads
      # NODE_URL / MERO_E2E_USER, so no manual token/install bootstrapping is needed.
      - name: Run e2e against released merod
        env:
          NODE_URL: http://localhost:4001
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
          NO_COLOR: '1'
          # The delegated-intent suite mints an author certificate and a warrant
          # offline, which only merod can do, so it is `describe.skipIf(!MEROD)`.
          # The binary is already downloaded above; without this it skipped here
          # and ran ONLY in core's sdk-e2e.yml — so this repo reported green on a
          # suite it had never executed.
          MEROD_BINARY: ${{ github.workspace }}/merod
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
          # Guard against a vacuous/all-skipped green: require at least one passing test.
          grep -qE "[1-9][0-9]* passed" e2e.log \
            || { echo "::error::e2e produced no passing tests — refusing a vacuous pass"; exit 1; }
          # And specifically that the delegated suite RAN. The guard above is
          # satisfied by any other file passing, so a silently skipped
          # delegated-intent would have gone unnoticed indefinitely — which is
          # exactly what happened until now. `skipIf` reports the file with no
          # test count, so requiring the count is what distinguishes ran from
          # skipped.
          #
          # Deliberately strict: it matches `(N tests)` but not
          # `(N tests | M skipped)`, so adding a conditionally-skipped test to
          # that file trips it. That is the right way round — a skip in this
          # suite is precisely what is being guarded against, and a loud failure
          # naming the file beats the silence it replaces.
          grep -qE "delegated-intent\.test\.ts.*\([0-9]+ tests?\)" e2e.log \
            || { echo "::error::delegated-intent suite did not run — MEROD_BINARY unset or merod unusable"; exit 1; }

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            merod.log
          if-no-files-found: warn

      - name: Stop merod
        if: always()
        run: kill "$(cat merod.pid 2>/dev/null)" 2>/dev/null || true

  multinode:
    name: Multi-node E2E (vs released merod)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Download released merod
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download-released-merod.sh

      - name: Boot 2 merod nodes (embedded auth)
        run: |
          # --mdns is load-bearing, not tidy-up. These two nodes have no
          # bootstrap peer and no rendezvous, so mDNS is their ONLY discovery
          # path. merod left it on by default until core#3620 ("leave mDNS off
          # unless asked for"), which first shipped in 0.11.0-rc.26 — and this
          # job downloads the LATEST release, so it broke the moment rc.26 was
          # cut, on a run that changed nothing here.
          #
          # The symptom points nowhere near the cause: node-2 finds no mesh
          # peer, falls back to gossip, KeyDelivery times out after 5s, and the
          # join refuses with a 500. That refusal is correct — a member that
          # cannot decrypt anything should not land — so the bug reads as
          # "namespace join is broken" rather than "the nodes never met".
          ./merod --home ./n1 --node n1 init --server-port 4501 --swarm-port 4601 --auth-mode embedded --mdns
          ./merod --home ./n2 --node n2 init --server-port 4502 --swarm-port 4602 --auth-mode embedded --mdns
          ./merod --home ./n1 --node n1 run > n1.log 2>&1 & echo $! > n1.pid
          ./merod --home ./n2 --node n2 run > n2.log 2>&1 & echo $! > n2.pid
          for port in 4501 4502; do
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/admin-api/health" >/dev/null 2>&1 && break
              sleep 2
              [ "$i" = "30" ] && { echo "merod on $port did not become healthy"; exit 1; }
            done
          done
          echo "both nodes healthy"

      - name: Run multi-node e2e
        env:
          MERO_MULTINODE: "1"
          MERO_NODE1_URL: http://localhost:4501
          MERO_NODE2_URL: http://localhost:4502
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
          NO_COLOR: '1'
        run: |
          set -o pipefail
          pnpm vitest run --config vitest.e2e.config.ts tests/e2e/multinode.test.ts 2>&1 | tee mn.log
          # The multi-node test is MERO_MULTINODE-gated; require it actually ran (not skipped).
          grep -qE "[1-9][0-9]* passed" mn.log \
            || { echo "::error::multi-node test did not run (skipped/vacuous) — failing"; exit 1; }

      - name: Upload multi-node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multinode-logs
          path: |
            mn.log
            n1.log
            n2.log
          if-no-files-found: warn

      - name: Stop nodes
        if: always()
        run: kill "$(cat n1.pid 2>/dev/null)" "$(cat n2.pid 2>/dev/null)" 2>/dev/null || true
