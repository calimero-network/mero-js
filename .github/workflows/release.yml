name: Release and Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    name: Create Release and Publish
    runs-on: ubuntu-latest
    # One release at a time: two overlapping runs would compute the same next
    # version and race on its tag. Queued, not cancelled, so no push is lost.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release }}
      version: ${{ steps.published.outputs.version }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@calimero-network'
          token: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        id: semantic
        run: |
          # semantic-release exits 0 both when it publishes and when it decides
          # there is nothing to release (no releasable commits, a run on a
          # branch it does not release from, a checkout already behind the
          # remote). Those stay green. Any non-zero exit is a real failure (bad
          # config, plugin crash, a tag that already exists) and fails the job.
          #
          # The log goes through tee rather than OUTPUT=$(...): the default
          # `bash -e` shell aborts on a failed command substitution before the
          # captured log is echoed, which left a red step with no explanation.
          # Without pipefail the pipeline's own status is tee's, so -e does not
          # fire here and the real status is read from PIPESTATUS.
          log="$RUNNER_TEMP/semantic-release.log"
          before=$(git rev-parse HEAD)
          pnpm exec semantic-release 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::semantic-release failed with exit code $status; its log is above"
            exit "$status"
          fi
          if grep -q "Published release" "$log"; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse HEAD)" != "$before" ]; then
            # @semantic-release/git commits the release locally (push: false),
            # so a moved HEAD means a release was made. Reaching here means the
            # log line this step keys on has changed; publishing nothing would
            # leave a tag and a GitHub release with no npm package behind them.
            echo "::error::semantic-release made a release commit but its log has no 'Published release' line; refusing to treat this as no release"
            exit 1
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      # Read from the tree rather than parsed out of semantic-release's log:
      # this is the exact package.json the publish step below uploads, so it
      # is by construction the version that reaches the registry.
      - name: Read the published version
        id: published
        if: steps.semantic.outputs.new_release == 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::publishing $version"

      - name: Publish to npm with OIDC
        if: steps.semantic.outputs.new_release == 'true'
        run: npm publish --provenance --access public

      - name: Push release commit and tag
        if: steps.semantic.outputs.new_release == 'true'
        env:
          VERSION: ${{ steps.published.outputs.version }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # semantic-release has already pushed the tag and created the GitHub
          # release, and the package is on npm; what is left is moving master
          # onto the release commit. Leaving it off master is not harmless: the
          # tag is then unreachable from master, so the next run recomputes the
          # same version and fails on the existing tag.
          #
          # The one expected failure is a race: a pull request merged while this
          # job ran, so the push is not a fast-forward. Merge the new master
          # into the release commit and push again; that keeps the tagged
          # commit an ancestor of master. The merge message is deliberately not
          # a conventional commit, so it never triggers a release of its own.
          # Anything else (auth, branch protection, a merge conflict) fails.
          for attempt in 1 2 3; do
            if git push origin HEAD:master --follow-tags; then
              exit 0
            fi
            git fetch origin master
            if git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "::error::pushing the $VERSION release commit to master failed, and not because master moved; master does not have the release commit"
              exit 1
            fi
            echo "::warning::master moved while $VERSION was being released; merging it into the release commit (attempt $attempt)"
            if ! git merge --no-edit -m "Merge master into the $VERSION release commit" FETCH_HEAD; then
              git merge --abort || true
              echo "::error::merging the new master into the $VERSION release commit conflicted; master does not have the release commit"
              exit 1
            fi
          done
          echo "::error::master kept moving; gave up pushing the $VERSION release commit after 3 attempts"
          exit 1

  # Opens the pull request that moves every consumer in .github/fleet.json onto
  # the version just published. Majors are skipped by default -- see the header
  # of fleet-bump.yml for why.
  fleet-bump:
    name: Open dependency bump PRs
    needs: release
    if: needs.release.outputs.new_release == 'true'
    uses: ./.github/workflows/fleet-bump.yml
    with:
      packages: "@calimero-network/mero-js=${{ needs.release.outputs.version }}"
      label: mero-js-${{ needs.release.outputs.version }}
    # ACTIONS_APP_PRIVATE_KEY, which the called workflow uses to mint a
    # per-repository installation token.
    secrets: inherit
